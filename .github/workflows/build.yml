name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: false
      - run: go test ./... && go vet ./... && go build ./...
        working-directory: server
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python deploy/test_fetch_clients.py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency tests failed' }
          python deploy/test_layer2_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'Layer2 transport tests failed' }
          powershell -NoProfile -File deploy/test-component-orchestration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Component orchestration test failed' }
          foreach ($test in @('test-client-uninstall.ps1','test-uninstall-windows.ps1','test-layer2-uninstall.ps1','test-progress.ps1')) {
            powershell -NoProfile -File (Join-Path deploy $test)
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
          powershell -NoProfile -File client/test-layer2-network.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Layer2 network guard test failed' }
          ./client/build.ps1
          foreach ($name in @('Link.exe','netbird.exe','wintun.dll','Uninstall.exe','uninstall.ps1','LICENSE','THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path "artifacts/client-windows-amd64/$name")) { throw "Missing client file: $name" }
          }
          ./client/build.ps1 -Check
          ./artifacts/client-windows-amd64/Link.Check.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows self-test failed' }
          ./artifacts/client-windows-amd64/Link.Check.exe --interaction-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows interaction test failed' }
