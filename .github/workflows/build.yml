name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: false
      - run: go test ./... && go vet ./... && go build ./...
        working-directory: server
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python deploy/test_fetch_clients.py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency tests failed' }
          ./client/build.ps1
          foreach ($name in @('Link.exe','netbird.exe','wintun.dll','Uninstall.exe','uninstall.ps1','LICENSE','THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path "artifacts/client-windows-amd64/$name")) { throw "Missing client file: $name" }
          }
          ./client/build.ps1 -Check
          ./artifacts/client-windows-amd64/Link.Check.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows self-test failed' }
