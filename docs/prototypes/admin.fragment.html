<div id="link-admin" aria-label="Link 服务端管理原型">
  <div class="la-shell">
    <aside class="la-sidebar">
      <div class="la-brand"><span class="la-mark"><i data-lucide="waypoints" aria-hidden="true"></i></span><strong>Link</strong><span class="la-brand-note">管理中心</span></div>
      <div class="la-workspace"><span class="la-workspace-icon">M</span><div>My network<small>个人空间</small></div></div>
      <nav class="la-nav" aria-label="管理导航"></nav>
      <div class="la-sidebar-bottom"><button type="button" data-action="activity"><i data-lucide="history" aria-hidden="true"></i>操作记录</button><div class="la-user"><span>A</span><div>admin<small>管理员</small></div></div></div>
    </aside>
    <div class="la-body">
      <header class="la-topbar"><span id="la-breadcrumb">My network <span>/</span> 设备</span><span class="la-private"><i data-lucide="shield-check" aria-hidden="true"></i>专用网络</span></header>
      <main class="la-main"></main>
      <footer class="la-footer"><span><span class="la-dot"></span>服务运行正常</span><span>Link · 自托管</span></footer>
    </div>
  </div>
  <div class="la-toast" role="status" aria-live="polite" hidden></div>
  <div class="la-overlay" hidden><section class="la-dialog" role="dialog" aria-modal="true" aria-labelledby="la-dialog-title"></section></div>
</div>
<style>

#link-admin .la-sidebar{background:var(--la-sub);border-right:1px solid var(--la-line);display:flex;flex-direction:column;padding:20px 12px 12px;gap:23px}#link-admin .la-brand{display:flex;align-items:center;gap:8px;padding:0 7px;flex-wrap:wrap}#link-admin .la-mark{width:26px;height:26px;border-radius:6px;background:var(--la-text);color:var(--la-bg);display:grid;place-items:center}#link-admin .la-brand strong{font-size:19px;letter-spacing:-.6px}#link-admin .la-brand-note{font-size:11px;color:var(--la-muted);margin-left:auto}#link-admin .la-workspace{border:1px solid var(--la-line);border-radius:var(--la-radius);display:flex;gap:10px;align-items:center;padding:10px;background:var(--la-bg)}#link-admin .la-workspace-icon,#link-admin .la-user>span{width:29px;height:29px;display:grid;place-items:center;border-radius:6px;background:var(--la-soft);font-size:12px}#link-admin small{display:block;color:var(--la-muted);font-size:11px}#link-admin .la-nav{display:grid;gap:5px}#link-admin .la-nav button,#link-admin .la-sidebar-bottom>button{border:0;background:none;text-align:left;display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:6px;color:var(--la-muted);width:100%}#link-admin .la-nav button[aria-current="page"]{background:var(--la-tint);color:var(--la-accent);font-weight:500}#link-admin .la-nav button:hover,#link-admin .la-sidebar-bottom>button:hover{background:var(--la-soft)}#link-admin .la-nav button span{margin-left:auto;font-size:11px}#link-admin .la-sidebar-bottom{margin-top:auto}#link-admin .la-user{border-top:1px solid var(--la-line);margin-top:13px;padding:15px 7px 1px;display:flex;gap:10px;align-items:center}
#link-admin .la-body{min-width:0;display:flex;flex-direction:column}#link-admin .la-topbar{min-height:60px;border-bottom:1px solid var(--la-line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 28px;font-size:12px}#link-admin #la-breadcrumb>span{color:var(--la-muted);margin:0 12px}#link-admin .la-private{display:flex;gap:6px;align-items:center;color:var(--la-muted);white-space:nowrap}#link-admin .la-private svg{width:14px;height:14px}#link-admin .la-main{padding:29px 28px 35px;flex:1;min-width:0}#link-admin .la-heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:26px}#link-admin h2{font-size:23px;line-height:1.3;letter-spacing:-.5px;font-weight:600;margin:0 0 7px}#link-admin p{margin:0;color:var(--la-muted);font-size:12px}#link-admin .la-button{border:1px solid var(--la-line);border-radius:var(--la-radius);background:var(--la-bg);padding:7px 11px;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap;min-height:34px}#link-admin .la-button:hover{background:var(--la-soft)}#link-admin .la-button.primary{background:var(--la-text);border-color:var(--la-text);color:var(--la-bg)}#link-admin .la-button.danger{color:var(--la-danger)}#link-admin .la-button svg{width:14px;height:14px}#link-admin .la-entry-strip{display:flex;gap:10px;align-items:center;border:1px solid var(--la-line);border-radius:var(--la-radius);padding:12px 14px;margin-bottom:23px;background:var(--la-sub);flex-wrap:wrap}#link-admin .la-entry-strip>svg{color:var(--la-accent)}#link-admin .la-entry-strip>span{color:var(--la-muted);font-size:12px}#link-admin .la-text-button{background:none;border:0;color:var(--la-accent);padding:4px;font-size:12px}#link-admin .la-entry-strip .la-text-button{margin-left:auto}
#link-admin .la-table-wrap{width:100%;overflow-x:auto}#link-admin table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}#link-admin th{font-weight:400;color:var(--la-muted);border-bottom:1px solid var(--la-line);padding:0 8px 12px;white-space:nowrap}#link-admin td{padding:17px 8px;border-bottom:1px solid var(--la-line);vertical-align:middle}#link-admin th:first-child,#link-admin td:first-child{padding-left:0}#link-admin th:last-child,#link-admin td:last-child{text-align:right;padding-right:0}#link-admin .la-device{display:flex;gap:11px;align-items:center;min-width:130px}#link-admin .la-device-icon{width:34px;height:34px;background:var(--la-sub);border:1px solid var(--la-line);border-radius:7px;display:grid;place-items:center;color:var(--la-muted)}#link-admin .la-device-name{font-size:13px;font-weight:500}#link-admin .la-device small{margin-top:2px}#link-admin .la-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--la-green);margin-right:6px;vertical-align:middle}#link-admin .la-dot.off{background:var(--la-muted)}#link-admin .la-status{white-space:nowrap}#link-admin .la-status small{padding-left:12px;margin-top:2px}#link-admin .la-mono{font-family:Consolas,monospace;font-size:12px;overflow-wrap:anywhere}#link-admin .la-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:4px;background:var(--la-tint);color:var(--la-accent);font-size:11px;white-space:nowrap}#link-admin .la-badge svg{width:12px;height:12px}#link-admin .la-muted{color:var(--la-muted)}#link-admin .la-table-note{font-size:11px;color:var(--la-muted);margin-top:15px}#link-admin .la-footer{display:flex;justify-content:space-between;gap:12px;color:var(--la-muted);font-size:11px;padding:12px 28px;border-top:1px solid var(--la-line)}
#link-admin .la-panel{border:1px solid var(--la-line);border-radius:var(--la-radius);overflow:hidden;margin-bottom:18px}#link-admin .la-panel-head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--la-sub);border-bottom:1px solid var(--la-line)}#link-admin .la-panel-head h3{font-size:14px;margin:0;font-weight:500}#link-admin .la-panel-content{padding:17px}#link-admin .la-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--la-line)}#link-admin .la-row:last-child{border-bottom:0}#link-admin .la-row small{font-size:12px;margin-top:3px}#link-admin .la-network-track{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:8px 0 20px}#link-admin .la-network-node{border:1px solid var(--la-line);padding:12px 16px;border-radius:7px;display:flex;align-items:center;gap:10px}#link-admin .la-network-node.entry{background:var(--la-tint);border-color:var(--la-tint)}#link-admin .la-switch{appearance:none;width:32px;height:18px;background:var(--la-line);border:0;border-radius:12px;position:relative;cursor:pointer;flex-shrink:0;margin:0}#link-admin .la-switch:after{content:"";position:absolute;width:12px;height:12px;top:3px;left:3px;background:var(--la-bg);border-radius:50%}#link-admin .la-switch:checked{background:var(--la-accent)}#link-admin .la-switch:checked:after{left:17px}
#link-admin .la-overlay{position:absolute;inset:0;background:light-dark(#18233266,#00000088);display:flex;align-items:flex-start;justify-content:center;padding:65px 18px 20px;z-index:5;min-height:100%;border-radius:9px}#link-admin .la-dialog{background:var(--la-bg);border:1px solid var(--la-line);border-radius:10px;box-shadow:0 16px 50px #00000026;width:440px;max-width:100%;padding:23px}#link-admin .la-dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}#link-admin .la-dialog h3{font-size:17px;font-weight:500;margin:0}#link-admin .la-close{border:0;background:none;color:var(--la-muted);padding:5px;display:flex}#link-admin .la-field{display:grid;gap:7px;font-size:12px;margin:16px 0}#link-admin .la-field input,#link-admin .la-field select{min-width:0;width:100%;border:1px solid var(--la-line);background:var(--la-sub);border-radius:6px;padding:9px 10px}#link-admin .la-dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--la-line);padding-top:18px;margin-top:20px}#link-admin .la-dialog .la-detail-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;font-size:12px}#link-admin .la-detail-row>span:first-child{color:var(--la-muted)}#link-admin .la-dialog .la-detail-row>span:last-child{text-align:right;overflow-wrap:anywhere}#link-admin .la-dialog .la-button.full{width:100%;margin-top:15px}#link-admin .la-error{color:var(--la-danger);font-size:12px;margin-top:8px}#link-admin .la-join-code{letter-spacing:3px;font-family:Consolas,monospace;font-size:23px;text-align:center;padding:20px;background:var(--la-sub);border:1px dashed var(--la-line);border-radius:6px;margin:18px 0}#link-admin .la-toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--la-text);color:var(--la-bg);padding:10px 17px;border-radius:7px;box-shadow:0 4px 20px #00000020;z-index:9;max-width:85%;font-size:12px}#link-admin .la-activity-item{padding:13px 0;border-bottom:1px solid var(--la-line);font-size:12px}#link-admin .la-activity-item small{margin-top:4px}#link-admin .la-empty{padding:36px 10px;text-align:center;color:var(--la-muted)}
@media(max-width:730px){#link-admin .la-shell{grid-template-columns:136px minmax(0,1fr)}#link-admin .la-brand-note{display:none}#link-admin .la-sidebar{padding:18px 8px 10px}#link-admin .la-main{padding:24px 18px}#link-admin .la-topbar,#link-admin .la-footer{padding-left:18px;padding-right:18px}#link-admin .la-ip-col{display:none}#link-admin .la-table-wrap table{min-width:360px}#link-admin .la-heading{flex-wrap:wrap}}
@media(max-width:480px){#link-admin .la-shell{display:block}#link-admin .la-sidebar{padding:12px;gap:12px;border-right:0;border-bottom:1px solid var(--la-line)}#link-admin .la-brand-note{display:block}#link-admin .la-workspace,#link-admin .la-sidebar-bottom{display:none}#link-admin .la-nav{display:flex;gap:4px;flex-wrap:wrap}#link-admin .la-nav button{width:auto;padding:7px;font-size:12px;gap:5px}#link-admin .la-nav button span{display:none}#link-admin .la-nav button svg{width:14px;height:14px}#link-admin .la-topbar{min-height:47px;padding:10px 14px}#link-admin .la-main{padding:22px 14px}#link-admin .la-role-col{display:none}#link-admin .la-table-wrap table{min-width:0}#link-admin .la-device{min-width:100px;gap:6px}#link-admin .la-device-icon{display:none}#link-admin .la-private{font-size:11px}#link-admin .la-footer{padding:12px 14px}#link-admin h2{font-size:21px}#link-admin .la-entry-strip{gap:6px}#link-admin .la-overlay{padding-top:40px}#link-admin .la-dialog{padding:18px}#link-admin .la-row{gap:10px}#link-admin .la-row>.la-mono{max-width:48%}}
</style>
<script>
(()=>{
 const root=document.getElementById('link-admin');
 const defaults={page:'devices',entry:'node-01',devices:[{name:'node-01',os:'Windows 11 Pro',ip:'100.96.10.11',state:'online',link:'直连',icon:'monitor'},{name:'workstation',os:'Windows 11 Pro',ip:'100.96.10.12',state:'online',link:'直连',icon:'monitor'},{name:'laptop',os:'Windows 11 Pro',ip:'100.96.10.13',state:'online',link:'中继',icon:'laptop'},{name:'mini-pc',os:'Windows 11 Pro',ip:'100.96.10.14',state:'offline',link:'',icon:'pc-case'}],services:[{name:'web-preview',device:'workstation',port:'8080',publicPort:18080},{name:'file-share',device:'node-01',port:'8090',publicPort:18081}],events:[{text:'node-01 已设为网络入口',time:'今天 09:24'},{text:'laptop 已加入网络',time:'今天 09:18'}],autoApprove:false};
 let s=structuredClone(defaults);let lastFocus=null,timer=null;
 const pages={devices:['设备','monitor'],networks:['网络入口','network'],services:['服务映射','arrow-left-right'],settings:['设置','settings-2']};
 const design={accent:'forest',density:'regular'};
 function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
 function applySaved(data){const p=data?.privateContent;if(p?.prototype==='link-admin'&&Array.isArray(p.state?.devices)&&pages[p.state.page])s=p.state;}
 applySaved(window.openai?.widgetState);
 function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'link-admin',page:s.page,entry:s.entry,deviceCount:s.devices.length},privateContent:{prototype:'link-admin',state:s}})?.catch(()=>{});}
 function log(text){s.events.unshift({text,time:'刚刚'});s.events=s.events.slice(0,15);}
 function toast(message){clearTimeout(timer);const el=root.querySelector('.la-toast');el.textContent=message;el.hidden=false;timer=setTimeout(()=>el.hidden=true,3500);}
 function close(){root.querySelector('.la-overlay').hidden=true;lastFocus?.focus();}
 function modal(title,content){lastFocus=document.activeElement;root.querySelector('.la-dialog').innerHTML=`<div class="la-dialog-head"><h3 id="la-dialog-title">${title}</h3><button class="la-close" data-action="close" aria-label="关闭" type="button">${icon('x')}</button></div>${content}`;root.querySelector('.la-overlay').hidden=false;icons();root.querySelector('.la-dialog button, .la-dialog input')?.focus();}
 function heading(title,sub,action=''){return `<div class="la-heading"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`;}
 function btn(text,action,cls='',extra=''){return `<button type="button" class="la-button ${cls}" data-action="${action}" ${extra}>${text}</button>`;}
 function deviceStatus(d){return `<span class="la-status"><span class="la-dot ${d.state==='online'?'':'off'}"></span>${{online:'在线',offline:'离线',disabled:'已停用',kicked:'已断开'}[d.state]}<small>${d.state==='online'?d.link:d.state==='offline'?'昨天 18:42':d.state==='kicked'?'等待手动连接':'访问已撤销'}</small></span>`;}
 function entryName(){return s.entry?esc(s.entry):'未设置';}
 function deviceTable(){return `<div class="la-table-wrap"><table><thead><tr><th>设备名称</th><th>状态</th><th class="la-ip-col">网络地址</th><th class="la-role-col">角色</th><th></th></tr></thead><tbody>${s.devices.map(d=>`<tr><td><div class="la-device"><span class="la-device-icon">${icon(d.icon)}</span><div><div class="la-device-name">${esc(d.name)}</div><small>${d.os}</small></div></div></td><td>${deviceStatus(d)}</td><td class="la-ip-col la-mono">${d.ip}</td><td class="la-role-col">${d.name===s.entry?`<span class="la-badge">${icon('network')}网络入口</span>`:'<span class="la-muted">普通设备</span>'}</td><td><button type="button" class="la-text-button" data-action="device" data-name="${esc(d.name)}">管理</button></td></tr>`).join('')}</tbody></table></div>`;}
 function render(){
 root.querySelector('.la-nav').innerHTML=Object.entries(pages).map(([key,[label,ic]])=>`<button type="button" data-page="${key}" ${s.page===key?'aria-current="page"':''}>${icon(ic)}${label}${key==='devices'?`<span>${s.devices.length}</span>`:''}</button>`).join('');
 root.querySelector('#la-breadcrumb').innerHTML=`My network <span>/</span> ${pages[s.page][0]}`;
 let html='';
 if(s.page==='devices')html=heading('设备',`${s.devices.length} 台已注册 · ${s.devices.filter(d=>d.state==='online').length} 台在线`,btn(icon('plus')+'添加设备','join','primary'))+`<div class="la-entry-strip">${icon('network')}<strong>默认网络</strong><span>入口 ${entryName()}</span><button type="button" class="la-text-button" data-page="networks">管理入口 →</button></div>`+deviceTable()+`<div class="la-table-note">设备仅对同一网络内获准的成员可见。</div>`;
 if(s.page==='networks')html=heading('网络入口','指定一台在线设备，访问它所在网络中的资源。')+`<div class="la-panel"><div class="la-panel-head"><h3>默认网络</h3>${btn('更换入口','choose-entry')}</div><div class="la-panel-content"><div class="la-network-track"><div class="la-network-node">${icon('laptop')}已授权设备</div>${icon('arrow-right')}<div class="la-network-node entry">${icon('network')}<div>${entryName()}<small>网络入口</small></div></div>${icon('arrow-right')}<span>本地资源</span></div><div class="la-row"><div>入口状态<small>由入口设备保持连接</small></div><span>${s.devices.some(d=>d.name===s.entry&&d.state==='online')?'<span class="la-dot"></span>可用':'<span class="la-dot off"></span>不可用'}</span></div><div class="la-row"><div>网络配置<small>地址与解析规则由设备自动同步</small></div><span class="la-muted">自动</span></div><div class="la-row"><div>访问范围<small>同一网络内已授权的设备</small></div><span>${s.devices.filter(d=>d.state!=='disabled').length} 台设备</span></div></div></div>`;
 if(s.page==='services')html=heading('服务映射','通过网络入口访问其他设备上的服务。',btn(icon('plus')+'添加映射','add-service','primary'))+`<div class="la-table-wrap"><table><thead><tr><th>服务</th><th>目标设备</th><th>状态</th><th></th></tr></thead><tbody>${s.services.map((v,i)=>{const ok=s.devices.some(d=>d.name===v.device&&d.state==='online')&&s.devices.some(d=>d.name===s.entry&&d.state==='online');return `<tr><td><div class="la-device-name">${esc(v.name)}</div><small>TCP · ${esc(v.port)}</small></td><td>${esc(v.device)}</td><td><span class="la-dot ${ok?'':'off'}"></span>${ok?'可用':'不可用'}</td><td><button class="la-text-button" type="button" data-action="service" data-index="${i}">详情</button></td></tr>`;}).join('')}</tbody></table></div><div class="la-table-note">入口地址和映射端口由系统分配。</div>`;
 if(s.page==='settings')html=heading('设置','管理当前实例的基本信息与设备加入方式。')+`<div class="la-panel"><div class="la-panel-head"><h3>实例</h3></div><div class="la-panel-content"><div class="la-row"><span>名称</span><span>My network</span></div><div class="la-row"><span>连接地址</span><span class="la-mono">mesh.example.net</span></div><div class="la-row"><span>管理中心访问</span><span class="la-badge">仅网络内</span></div></div></div><div class="la-panel"><div class="la-panel-head"><h3>设备加入</h3></div><div class="la-panel-content"><label class="la-row"><div>加入后需要批准<small>新设备获得批准后才能访问网络资源</small></div><input class="la-switch" type="checkbox" data-setting="approval" ${!s.autoApprove?'checked':''}></label><div class="la-row"><div>加入凭据<small>使用有时效的一次性加入码</small></div>${btn('生成加入码','join')}</div></div></div>`;
 root.querySelector('.la-main').innerHTML=html;icons();
 }
 function deviceModal(name){const d=s.devices.find(x=>x.name===name);if(!d)return;modal(esc(d.name),`<div class="la-detail-row"><span>状态</span>${deviceStatus(d)}</div><div class="la-detail-row"><span>系统</span><span>${d.os}</span></div><div class="la-detail-row"><span>网络地址</span><span class="la-mono">${d.ip}</span></div><div class="la-detail-row"><span>角色</span><span>${name===s.entry?'网络入口':'普通设备'}</span></div>${btn(name===s.entry?'移除入口角色':'设为网络入口','set-entry','full',`data-name="${esc(name)}" ${d.state!=='online'?'disabled':''}`)}<div class="la-dialog-actions">${d.state==='disabled'?btn('启用设备','enable','',`data-name="${esc(name)}"`):btn('停用','confirm-disable','danger',`data-name="${esc(name)}"`)}${btn('踢下线','confirm-kick','',`data-name="${esc(name)}" ${d.state!=='online'?'disabled':''}`)}${btn('完成','close','primary')}</div>`);}
 root.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.page){s.page=button.dataset.page;render();save();return;}
 const a=button.dataset.action,n=button.dataset.name;const d=s.devices.find(x=>x.name===n);
 if(a==='close'){close();return;}
 if(a==='device'){deviceModal(n);return;}
 if(a==='set-entry'){const removing=s.entry===n;s.entry=removing?null:n;log(removing?`${n} 已移除入口角色`:`${n} 已设为网络入口`);close();render();save();toast(removing?'入口角色已移除':`${n} 已设为网络入口`);return;}
 if(a==='choose-entry'){modal('选择网络入口',`<p>入口设备需要保持在线。</p><label class="la-field">设备<select id="la-entry-choice">${s.devices.filter(x=>x.state==='online').map(x=>`<option value="${esc(x.name)}" ${x.name===s.entry?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="la-dialog-actions">${btn('取消','close')}${btn('设为入口','apply-entry','primary',s.devices.some(x=>x.state==='online')?'':'disabled')}</div>`);return;}
 if(a==='apply-entry'){s.entry=root.querySelector('#la-entry-choice').value;log(`${s.entry} 已设为网络入口`);close();render();save();toast('网络入口已更新');return;}
 if(a==='confirm-disable'||a==='confirm-kick'){const disable=a==='confirm-disable';modal(disable?'停用设备':'踢下线',`<p>${esc(n)} ${disable?'将失去网络访问权限，启用后才能重新连接。':'将断开当前连接，需要在客户端手动重新连接。'}${n===s.entry?' 此设备是当前网络入口，相关资源与映射也将不可用。':''}</p><div class="la-dialog-actions">${btn('取消','close')}${btn(disable?'停用设备':'确认断开',disable?'disable':'kick','danger',`data-name="${esc(n)}"`)}</div>`);return;}
 if(['disable','kick','enable'].includes(a)){d.state=a==='disable'?'disabled':a==='kick'?'kicked':'offline';log(`${n} ${a==='disable'?'已停用':a==='kick'?'已踢下线':'已启用'}`);close();render();save();toast(a==='enable'?'已启用，等待设备连接':'操作已完成');return;}
 if(a==='join'){modal('添加设备',`<p>在新设备的客户端中填写以下信息。</p><label class="la-field">服务端地址<input readonly value="https://mesh.example.net"></label><div class="la-field">一次性加入码</div><div class="la-join-code">LINK-7K4P</div><p>15 分钟内有效 · 仅可使用一次</p><div class="la-dialog-actions">${btn('完成','close','primary')}</div>`);return;}
 if(a==='activity'){modal('操作记录',s.events.map(v=>`<div class="la-activity-item">${esc(v.text)}<small>admin · ${v.time}</small></div>`).join('')+`<div class="la-dialog-actions">${btn('关闭','close')}</div>`);return;}
 if(a==='add-service'){modal('添加服务映射',`<label class="la-field">名称<input id="la-service-name" placeholder="例如 web-preview" maxlength="40"></label><label class="la-field">目标设备<select id="la-service-device">${s.devices.filter(v=>v.state==='online').map(v=>`<option>${esc(v.name)}</option>`).join('')}</select></label><label class="la-field">目标应用<select id="la-service-port"><option value="8080">Web application · 8080</option><option value="9000">API service · 9000</option><option value="3000">Preview server · 3000</option></select></label><p>入口地址和映射端口将自动分配。</p><div id="la-service-error" class="la-error" role="alert"></div><div class="la-dialog-actions">${btn('取消','close')}${btn('添加映射','save-service','primary')}</div>`);return;}
 if(a==='save-service'){const name=root.querySelector('#la-service-name').value.trim(),port=root.querySelector('#la-service-port').value,device=root.querySelector('#la-service-device').value;if(!name||!device||!Number.isInteger(Number(port))||Number(port)<1||Number(port)>65535){root.querySelector('#la-service-error').textContent='请填写名称、设备和有效的服务端口。';return;}if(s.services.some(v=>v.name===name)){root.querySelector('#la-service-error').textContent='该名称已存在，请使用其他名称。';return;}s.services.push({name,device,port,publicPort:Math.max(18079,...s.services.map(v=>v.publicPort))+1});log(`已添加服务映射 ${name}`);close();render();save();toast('服务映射已添加');return;}
 if(a==='service'){const v=s.services[Number(button.dataset.index)];modal(esc(v.name),`<div class="la-detail-row"><span>目标设备</span><span>${esc(v.device)}</span></div><div class="la-detail-row"><span>服务端口</span><span class="la-mono">${esc(v.port)}</span></div><div class="la-detail-row"><span>网络入口</span><span>${entryName()}</span></div><div class="la-detail-row"><span>映射端口</span><span class="la-mono">${v.publicPort} · 自动分配</span></div><div class="la-detail-row"><span>协议</span><span>TCP</span></div><div class="la-dialog-actions">${btn('移除映射','remove-service','danger',`data-index="${button.dataset.index}"`)}${btn('完成','close','primary')}</div>`);return;}
 if(a==='remove-service'){log(`已移除服务映射 ${s.services[Number(button.dataset.index)].name}`);s.services.splice(Number(button.dataset.index),1);close();render();save();toast('映射已移除');}
 });
 root.addEventListener('change',e=>{if(e.target.dataset.setting==='approval'){s.autoApprove=!e.target.checked;log('已更新设备加入设置');save();toast('设置已保存');}});
 root.addEventListener('keydown',e=>{if(root.querySelector('.la-overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...root.querySelectorAll('.la-dialog button:not(:disabled),.la-dialog input,.la-dialog select')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 root.querySelector('.la-overlay').addEventListener('click',e=>{if(e.target.classList.contains('la-overlay'))close();});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){applySaved(e.detail.globals.widgetState);render();}});
 function appearance(){const colors={forest:['light-dark(#276657,#83c6af)','light-dark(#eaf3ee,#243c32)'],slate:['light-dark(#405975,#aac2dd)','light-dark(#eaf0f6,#28374a)'],neutral:['light-dark(#414852,#c3cbd4)','light-dark(#eef0f2,#303640)']};root.style.setProperty('--la-accent',colors[design.accent][0]);root.style.setProperty('--la-tint',colors[design.accent][1]);root.querySelector('.la-main').style.paddingTop=design.density==='compact'?'20px':'29px';}
 render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:appearance});t.addSelect(design,'accent',{label:'强调色',options:[{label:'松绿',value:'forest'},{label:'灰蓝',value:'slate'},{label:'石墨',value:'neutral'}]});t.addSelect(design,'density',{label:'留白',options:[{label:'标准',value:'regular'},{label:'紧凑',value:'compact'}]});}
})();
</script>
