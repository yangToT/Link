    <div class="lc-wallpaper" aria-hidden="true"></div>
    <section class="lc-window">
      <header class="lc-titlebar"><div><i data-lucide="waypoints" aria-hidden="true"></i><span>Link</span></div><div class="lc-window-chrome" aria-hidden="true"><span>―</span><i data-lucide="square"></i><i data-lucide="x"></i></div></header>
      <div class="lc-role"></div>
      <nav class="lc-tabs" aria-label="客户端导航"></nav>
      <main class="lc-main"></main>
      <footer class="lc-footer"><span class="lc-footer-state"></span><span>My network</span></footer>
    </section>
    <div class="lc-toast" role="status" aria-live="polite" hidden></div>
    <div class="lc-overlay" hidden><section class="lc-dialog" role="dialog" aria-modal="true" aria-labelledby="lc-dialog-title"></section></div>
  </div>
</div>
<style>

#link-client .lc-connection{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 26px}#link-client .lc-status-block{display:flex;gap:14px;align-items:center}#link-client .lc-status-icon{width:48px;height:48px;border-radius:14px;background:var(--lc-panel);border:1px solid light-dark(#ffffff8a,#a9c1cb33);display:grid;place-items:center;color:var(--lc-accent);box-shadow:0 2px 8px #253b4706}#link-client .lc-status-icon svg{width:25px;height:25px}#link-client h2{font-size:23px;line-height:1.35;font-weight:600;letter-spacing:-.6px;margin:0 0 3px}#link-client h3{font-size:14px;font-weight:500;margin:0}#link-client p{font-size:12px;color:var(--lc-muted);margin:0}#link-client .lc-button{border:1px solid var(--lc-line);border-radius:6px;background:var(--lc-panel);padding:7px 12px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}#link-client .lc-button:hover{background:var(--lc-field)}#link-client .lc-button.primary{background:var(--lc-button);color:var(--lc-button-text);border-color:transparent}#link-client .lc-button svg{width:15px;height:15px}#link-client .lc-panel{border:1px solid var(--lc-line);background:var(--lc-panel);border-radius:8px;padding:1px 16px;margin-bottom:18px;box-shadow:inset 0 1px 0 light-dark(#ffffff6b,#ffffff08)}#link-client .lc-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--lc-line);font-size:12px}#link-client .lc-row:last-child{border-bottom:0}#link-client .lc-row>span:first-child{color:var(--lc-muted)}#link-client .lc-mono{font:12px/1.55 Consolas,monospace;overflow-wrap:anywhere}#link-client .lc-row>span:last-child{text-align:right}#link-client .lc-quick{width:100%;background:var(--lc-panel);border:1px solid var(--lc-line);border-radius:8px;padding:14px 16px;display:flex;align-items:center;text-align:left;gap:12px}#link-client .lc-quick:hover{background:var(--lc-field)}#link-client .lc-quick>svg:first-child{color:var(--lc-accent);width:20px;height:20px}#link-client .lc-quick>svg:last-child{margin-left:auto;color:var(--lc-muted);width:15px;height:15px}#link-client .lc-quick small{display:block;font-size:11px;margin-top:2px;color:var(--lc-muted)}#link-client .lc-bottom-note{font-size:11px;color:var(--lc-muted);text-align:center;margin-top:16px}#link-client .lc-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:20px}#link-client .lc-heading h2{font-size:19px;margin-bottom:4px}#link-client .lc-list-row{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--lc-line)}#link-client .lc-list-row:last-child{border-bottom:0}#link-client .lc-device-icon{width:35px;height:35px;display:grid;place-items:center;background:var(--lc-panel);border:1px solid var(--lc-line);border-radius:7px;color:var(--lc-muted)}#link-client .lc-device-detail{flex:1;min-width:0}#link-client .lc-device-detail small{display:block;margin-top:3px;color:var(--lc-muted);font-size:11px}#link-client .lc-badge{font-size:10px;padding:2px 5px;border:1px solid var(--lc-line);border-radius:4px;color:var(--lc-muted);margin-left:6px;white-space:nowrap}#link-client .lc-text-button{border:0;background:none;color:var(--lc-accent);font-size:12px;padding:5px}#link-client .lc-switch{appearance:none;width:33px;height:18px;border-radius:12px;background:light-dark(#96a6b2,#556b7b);position:relative;cursor:pointer;border:0;margin:0;flex-shrink:0}#link-client .lc-switch:after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--lc-solid)}#link-client .lc-switch:checked{background:var(--lc-accent)}#link-client .lc-switch:checked:after{left:18px}#link-client .lc-setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--lc-line);font-size:12px}#link-client .lc-setting:last-child{border:0}#link-client .lc-setting small{font-size:11px;color:var(--lc-muted);display:block;margin-top:3px}#link-client .lc-section-label{font-size:11px;color:var(--lc-muted);margin:21px 0 10px}#link-client .lc-field{display:grid;gap:7px;font-size:12px;margin:15px 0}#link-client .lc-field input,#link-client .lc-field select{min-width:0;width:100%;border:1px solid var(--lc-line);background:var(--lc-field);border-radius:6px;padding:9px 10px}#link-client .lc-join-title{display:flex;gap:12px;align-items:center;margin-bottom:22px}#link-client .lc-full{width:100%;margin-top:8px}#link-client .lc-error{font-size:12px;color:light-dark(#a24440,#f0a8a3);margin:8px 0}#link-client .lc-service-state{font-size:11px;color:var(--lc-muted)}#link-client .lc-empty{padding:30px 0;color:var(--lc-muted);text-align:center;font-size:12px}
#link-client .lc-overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:115px 22px 30px;background:light-dark(#273f4a25,#0c17254a);backdrop-filter:blur(4px);z-index:5;border-radius:13px}#link-client .lc-dialog{width:420px;max-width:100%;padding:22px;background:var(--lc-solid);border:1px solid light-dark(#ffffff,#65809655);border-radius:9px;box-shadow:0 18px 55px #0c1a3333}#link-client .lc-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}#link-client .lc-dialog h3{font-size:17px}#link-client .lc-close{background:none;border:0;color:var(--lc-muted);padding:4px;display:flex}#link-client .lc-dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--lc-line);padding-top:17px;margin-top:20px}#link-client .lc-dialog .lc-panel{margin-top:16px}#link-client .lc-toast{position:absolute;bottom:53px;left:50%;transform:translateX(-50%);background:var(--lc-button);color:var(--lc-button-text);box-shadow:0 6px 25px #13233022;border-radius:7px;padding:10px 15px;z-index:8;max-width:85%;font-size:12px}#link-client .lc-dialog-code{padding:13px;background:var(--lc-field);border:1px solid var(--lc-line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;margin:16px 0}#link-client .lc-dialog .lc-list-row{padding:11px 0}#link-client .lc-muted{color:var(--lc-muted)}
#link-client .lc-text-button{display:inline-flex;align-items:center;gap:5px}#link-client .lc-quick>:last-child{margin-left:auto}
@media(max-width:520px){#link-client .lc-desktop{padding:22px 15px;min-height:620px}#link-client .lc-window{min-height:575px}#link-client .lc-main{padding:22px 19px}#link-client .lc-role{margin-left:17px;margin-right:17px}#link-client .lc-tabs{margin-left:17px;margin-right:17px;gap:17px}#link-client .lc-titlebar{padding-left:16px}#link-client .lc-footer{padding-left:18px;padding-right:18px}#link-client .lc-connection{gap:9px}#link-client .lc-status-icon{width:40px;height:40px;border-radius:11px}#link-client .lc-status-block{gap:10px}#link-client h2{font-size:21px}#link-client .lc-button{padding:7px 9px}#link-client .lc-overlay{padding-top:85px}}
@media(max-width:355px){#link-client .lc-desktop{padding:14px 8px}#link-client .lc-main{padding:20px 13px}#link-client .lc-tabs{gap:12px;margin-left:13px;margin-right:13px}#link-client .lc-tabs button{gap:4px}#link-client .lc-tabs svg{width:13px;height:13px}#link-client .lc-role{margin-left:13px;margin-right:13px;font-size:11px}#link-client .lc-role>span{font-size:10px}#link-client .lc-device-icon{display:none}#link-client .lc-status-icon{display:none}#link-client .lc-row{gap:10px}#link-client .lc-panel{padding-left:12px;padding-right:12px}#link-client .lc-row>.lc-mono{max-width:62%}}
</style>
<script>
(()=>{
 const root=document.getElementById('link-client');
 let s={page:'connection',connected:true,registered:true,server:'https://mesh.example.net',entry:true,autoStart:true,autoConnect:true,keepRunning:true,openManager:true,services:[{name:'file-share',app:'File server',port:'8090',publicPort:18081}]};
 const pages={connection:['连接','plug'],devices:['设备','monitor'],services:['服务','arrow-left-right'],settings:['设置','settings-2']};
 const design={opacity:64,blur:26,entry:true};let timer,lastFocus;
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const peers=[{name:'node-01',ip:'100.96.10.11',icon:'monitor',self:true,link:'本机',online:true},{name:'workstation',ip:'100.96.10.12',icon:'monitor',link:'直连',online:true},{name:'laptop',ip:'100.96.10.13',icon:'laptop',link:'中继',online:true},{name:'mini-pc',ip:'100.96.10.14',icon:'pc-case',link:'离线',online:false}];
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
 function load(data){const p=data?.privateContent;if(p?.prototype==='link-client'&&pages[p.state?.page]&&Array.isArray(p.state?.services)){s=p.state;design.entry=s.entry;}}
 load(window.openai?.widgetState);
 function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'link-client',page:s.page,connected:s.connected,entry:s.entry,appearance:'frosted glass'},privateContent:{prototype:'link-client',state:s}})?.catch(()=>{});}
 function toast(message){clearTimeout(timer);const t=root.querySelector('.lc-toast');t.textContent=message;t.hidden=false;timer=setTimeout(()=>t.hidden=true,3500);}
 function button(text,action,cls='',extra=''){return `<button type="button" class="lc-button ${cls}" data-action="${action}" ${extra}>${text}</button>`;}
 function modal(title,html){lastFocus=document.activeElement;root.querySelector('.lc-dialog').innerHTML=`<div class="lc-dialog-head"><h3 id="lc-dialog-title">${title}</h3><button class="lc-close" type="button" data-action="close" aria-label="关闭">${icon('x')}</button></div>${html}`;root.querySelector('.lc-overlay').hidden=false;icons();root.querySelector('.lc-dialog button,.lc-dialog input')?.focus();}
 function close(){root.querySelector('.lc-overlay').hidden=true;lastFocus?.focus();}
 function serviceReady(){return s.connected;}
 function render(){
 const role=root.querySelector('.lc-role');role.classList.toggle('inactive',!s.connected||!s.entry);role.innerHTML=icon('network')+(s.entry?`<strong>本机为网络入口</strong><span>${s.connected?'正在共享网络':'连接后恢复共享'}</span>`:`<strong>网络入口 · workstation</strong><span>${s.connected?'可用':'未连接'}</span>`);
 root.querySelector('.lc-tabs').innerHTML=Object.entries(pages).map(([k,[label,ic]])=>`<button type="button" data-page="${k}" ${s.page===k?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('');
 root.querySelector('.lc-footer-state').innerHTML=`<span class="lc-dot ${s.connected?'':'off'}"></span>${s.connected?'网络可用':'未连接'}`;
 let html='';
 if(s.page==='connection'&&s.connected)html=`<div class="lc-connection"><div class="lc-status-block"><span class="lc-status-icon">${icon('shield-check')}</span><div><h2>已连接</h2><p>node-01 · Windows 11 Pro</p></div></div>${button('断开连接','disconnect')}</div><div class="lc-panel"><div class="lc-row"><span>服务端</span><span class="lc-mono">${esc(s.server.replace(/^https?:\/\//,''))}</span></div><div class="lc-row"><span>网络地址</span><span class="lc-mono">100.96.10.11</span></div><div class="lc-row"><span>可用设备</span><button type="button" class="lc-text-button" data-page="devices">2 台在线 ${icon('chevron-right')}</button></div></div><button type="button" class="lc-quick" data-action="manager">${icon('panels-top-left')}<span>打开管理中心<small>设备、网络入口与服务映射</small></span>${icon('arrow-up-right')}</button><p class="lc-bottom-note">关闭窗口后，连接将在后台保持。</p>`;
 if(s.page==='connection'&&!s.connected)html=`<div class="lc-join-title"><span class="lc-status-icon">${icon('plug')}</span><div><h2>${s.registered?'已断开':'连接到网络'}</h2><p>${s.registered?'设备已注册，可以随时重新连接。':'输入服务端地址和加入码。'}</p></div></div><label class="lc-field">服务端地址<input id="lc-server" value="${esc(s.server)}" placeholder="https://mesh.example.net" ${s.registered?'readonly':''}></label>${!s.registered?'<label class="lc-field">加入码<input id="lc-key" placeholder="输入管理员提供的加入码" autocomplete="off"></label>':'<div class="lc-row"><span>设备名称</span><span>node-01</span></div>'}<div id="lc-connect-error" class="lc-error" role="alert"></div>${button(s.registered?'重新连接':'注册并连接','connect','primary lc-full')}<div class="lc-bottom-note"><button type="button" class="lc-text-button" data-action="change-server">${s.registered?'连接其他服务端':'使用已有设备身份'}</button></div>`;
 if(s.page==='devices')html=`<div class="lc-heading"><div><h2>设备</h2><p>${s.connected?'同一网络中的 4 台设备':'连接后可访问其他设备'}</p></div></div>${peers.map(p=>`<div class="lc-list-row"><span class="lc-device-icon">${icon(p.icon)}</span><div class="lc-device-detail">${p.name}${p.self?'<span class="lc-badge">本机</span>':''}${(s.entry&&p.self)||(!s.entry&&p.name==='workstation')?'<span class="lc-badge">入口</span>':''}<small><span class="lc-dot ${p.online&&s.connected?'':'off'}"></span>${s.connected?p.link:'未连接'} · <span class="lc-mono">${p.ip}</span></small></div>${!p.self?button('远程桌面','remote','',`data-name="${p.name}" ${!p.online||!s.connected?'disabled':''}`):''}</div>`).join('')}`;
 if(s.page==='services')html=`<div class="lc-heading"><div><h2>本机服务</h2><p>选择允许通过网络入口访问的应用。</p></div>${button(icon('plus')+'添加','add-service','',s.connected?'':'disabled')}</div>${s.services.length?s.services.map((v,i)=>`<div class="lc-list-row"><span class="lc-device-icon">${icon('box')}</span><div class="lc-device-detail">${esc(v.name)}<small>${esc(v.app)} · TCP ${v.port}</small><small><span class="lc-dot ${serviceReady()?'':'off'}"></span>${serviceReady()?'可访问':'等待连接'}</small></div><button type="button" class="lc-text-button" data-action="service" data-index="${i}">详情</button></div>`).join(''):'<div class="lc-empty">尚未共享本机服务</div>'}<div class="lc-bottom-note">访问地址由系统分配，可在服务详情中查看。</div>`;
 if(s.page==='settings')html=`<div class="lc-heading"><div><h2>设置</h2><p>启动与连接行为</p></div></div><div class="lc-panel">${[['autoStart','开机启动','Windows 启动后运行'],['autoConnect','自动连接','启动后连接到上次使用的服务端'],['keepRunning','关闭窗口后保持运行','在系统托盘中管理连接'],['openManager','首次连接后打开管理中心','自动重连时不重复打开']].map(([key,label,sub])=>`<label class="lc-setting"><div>${label}<small>${sub}</small></div><input class="lc-switch" type="checkbox" data-setting="${key}" ${s[key]?'checked':''}></label>`).join('')}</div><div class="lc-section-label">当前设备</div><div class="lc-row"><span>设备名称</span><span>node-01</span></div><div class="lc-row"><span>服务端</span><span class="lc-mono">${esc(s.server.replace(/^https?:\/\//,''))}</span></div><div class="lc-row"><span>连接诊断</span><button class="lc-text-button" type="button" data-action="diagnose">检查连接</button></div>`;
 root.querySelector('.lc-main').innerHTML=html;icons();
 }
 root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;if(b.dataset.page){s.page=b.dataset.page;render();save();return;}
 const a=b.dataset.action;
 if(a==='close'){close();return;}
 if(a==='disconnect'){modal('断开连接',`<p>${s.entry?'本机是网络入口。断开后，其他设备将暂时无法通过本机访问网络资源。':'断开后将无法访问网络内的设备和服务。'}</p><div class="lc-dialog-actions">${button('取消','close')}${button('断开连接','disconnect-now','primary')}</div>`);return;}
 if(a==='disconnect-now'){s.connected=false;close();render();save();return;}
 if(a==='connect'){const address=root.querySelector('#lc-server').value.trim(),key=root.querySelector('#lc-key');let valid=false;try{valid=new URL(address).protocol==='https:';}catch{}if(!valid){root.querySelector('#lc-connect-error').textContent='请填写有效的 HTTPS 服务端地址。';return;}if(!s.registered&&(!key||!key.value.trim())){root.querySelector('#lc-connect-error').textContent='请输入加入码。';return;}s.server=address;s.connected=true;s.registered=true;render();save();toast('连接已建立');return;}
 if(a==='change-server'){s.registered=!s.registered;render();save();return;}
 if(a==='manager'){modal('管理中心',`<p>My network <span class="lc-badge">仅网络内</span></p><div class="lc-panel"><div class="lc-row"><span>设备</span><span>4 台 · 3 台在线</span></div><div class="lc-row"><span>网络入口</span><span>${s.entry?'node-01':'workstation'}</span></div><div class="lc-row"><span>服务映射</span><span>${s.services.length+1} 项</span></div><div class="lc-row"><span>当前用户</span><span>admin</span></div></div><div class="lc-dialog-actions">${button('返回客户端','close','primary')}</div>`);return;}
 if(a==='remote'){const p=peers.find(x=>x.name===b.dataset.name);modal('远程桌面连接',`<div class="lc-join-title"><span class="lc-status-icon">${icon('monitor')}</span><div><h3>${p.name}</h3><p>Windows 11 Pro</p></div></div><div class="lc-row"><span>计算机</span><span class="lc-mono">${p.ip}</span></div><div class="lc-row"><span>连接方式</span><span>${p.link}</span></div><div class="lc-dialog-actions">${button('取消','close')}${button('连接','remote-start','primary',`data-name="${p.name}"`)}</div>`);return;}
 if(a==='remote-start'){close();toast(`原型预览：远程桌面 → ${b.dataset.name}`);return;}
 if(a==='add-service'){modal('添加本机服务',`<label class="lc-field">选择应用<select id="lc-app"><option value="8080">Web application · 8080</option><option value="9000">API service · 9000</option><option value="3000">Preview server · 3000</option></select></label><label class="lc-field">显示名称<input id="lc-service-name" placeholder="例如 api-preview" maxlength="40"></label><p>系统将分配访问地址并建立服务映射。</p><div id="lc-service-error" class="lc-error" role="alert"></div><div class="lc-dialog-actions">${button('取消','close')}${button('添加服务','save-service','primary')}</div>`);return;}
 if(a==='save-service'){const name=root.querySelector('#lc-service-name').value.trim(),app=root.querySelector('#lc-app');if(!name||s.services.some(v=>v.name===name)){root.querySelector('#lc-service-error').textContent=name?'名称已存在，请使用其他名称。':'请输入服务名称。';return;}s.services.push({name,app:app.selectedOptions[0].textContent.split(' · ')[0],port:app.value,publicPort:Math.max(18079,...s.services.map(x=>x.publicPort))+1});close();render();save();toast('服务已添加');return;}
 if(a==='service'){const v=s.services[Number(b.dataset.index)];modal(esc(v.name),`<div class="lc-row"><span>本机应用</span><span>${esc(v.app)}</span></div><div class="lc-row"><span>运行状态</span><span>${s.connected?'可访问':'等待连接'}</span></div><div class="lc-row"><span>本机端口</span><span class="lc-mono">${v.port}</span></div><div class="lc-row"><span>入口设备</span><span>${s.entry?'node-01':'workstation'}</span></div><div class="lc-row"><span>映射端口</span><span class="lc-mono">${v.publicPort} · 自动分配</span></div><div class="lc-dialog-actions">${button('移除','remove-service','',`data-index="${b.dataset.index}"`)}${button('完成','close','primary')}</div>`);return;}
 if(a==='remove-service'){s.services.splice(Number(b.dataset.index),1);close();render();save();toast('服务已移除');return;}
 if(a==='diagnose'){modal('连接检查',`<div class="lc-row"><span>服务端</span><span>${s.connected?'已连接':'未连接'}</span></div><div class="lc-row"><span>设备身份</span><span>${s.registered?'已注册':'未注册'}</span></div><div class="lc-row"><span>网络入口</span><span>${s.connected?'可用':'等待连接'}</span></div><div class="lc-row"><span>管理中心</span><span>${s.connected?'可访问':'不可访问'}</span></div><div class="lc-dialog-actions">${button('完成','close','primary')}</div>`);}
 });
 root.addEventListener('change',e=>{const key=e.target.dataset.setting;if(key){s[key]=e.target.checked;save();toast('设置已保存');}});
 root.addEventListener('keydown',e=>{if(root.querySelector('.lc-overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...root.querySelectorAll('.lc-dialog button:not(:disabled),.lc-dialog input,.lc-dialog select')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 root.querySelector('.lc-overlay').addEventListener('click',e=>{if(e.target.classList.contains('lc-overlay'))close();});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){load(e.detail.globals.widgetState);render();}});
 function appearance(){root.style.setProperty('--lc-glass',`light-dark(rgb(255 255 255 / ${design.opacity/100}),rgb(24 34 43 / ${Math.min(95,design.opacity+8)/100}))`);root.querySelector('.lc-window').style.backdropFilter=`blur(${design.blur}px) saturate(125%)`;s.entry=design.entry;render();}
 render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:appearance});t.addSlider(design,'opacity',{label:'玻璃不透明度',min:40,max:90,step:5,unit:'%'});t.addSlider(design,'blur',{label:'背景模糊',min:8,max:40,step:2,unit:'px'});t.addToggle(design,'entry',{label:'本机作为网络入口'});}
})();
</script>
